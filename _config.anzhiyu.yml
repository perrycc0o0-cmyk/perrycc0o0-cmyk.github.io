    enable: true
    since: 2026
  custom_text: <div class="perry-footer-brand">PERRY'S GALAXY<small>Biology · Computation · Curiosity</small></div><div class="perry-footer-links"><a href="/atom.xml">RSS</a><a href="https://hexo.io/" target="_blank" rel="noopener">Hexo</a><a href="https://github.com/anzhiyu-c/hexo-theme-anzhiyu" target="_blank" rel="noopener">AnZhiYu</a></div>
