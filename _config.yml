title: Perry's Galaxy
subtitle: Biology · Computation · Curiosity
description: "Perry's Galaxy: public notes on biology, computation, artificial intelligence, programming, data, papers, methods and everyday curiosity."
keywords: Perry, Biology, Computation, AI, Science, Research, Programming, Data, Notes
author: Perry
language: zh-CN
timezone: Asia/Shanghai

url: https://perryery.github.io
permalink: posts/:abbrlink/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ""
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ""
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ""

index_generator:
  path: ""
  per_page: 10
  order_by: -date
per_page: 10
pagination_dir: page

theme: anzhiyu

feed:
  type: atom
  path: atom.xml
  limit: 20

search:
  path: search.xml
  field: post
  content: true
  format: html

sitemap:
  path: sitemap.xml

abbrlink:
  alg: crc32
  rep: hex

deploy:
  type: ""
